<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvtoShop</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#0f0f0f;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:15px;
}

.product{
    background:#1f1f1f;
    padding:12px;
    border-radius:10px;
    text-align:center;
}

.product img{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:8px;
}

.product h3{
    margin:8px 0;
    font-size:15px;
}

.price{
    color:#00c853;
    font-weight:bold;
    margin:5px 0;
}

button{
    width:100%;
    padding:8px;
    border:none;
    border-radius:6px;
    background:#00c853;
    color:white;
    font-weight:bold;
}

button:hover{
    background:#00e676;
}
</style>
</head>

<body>

<header>🚗 AvtoShop</header>

<div class="container">

<!-- BMW -->
<div class="product">
<img src="https://cdn.pixabay.com/photo/2016/04/01/10/58/car-1300629_1280.png">
<h3>BMW Filter</h3>
<div class="price">15 AZN</div>
<button onclick="window.open('https://wa.me/994503843635?text=Salam BMW filter sifariş etmək istəyirəm','_blank')">
Sifariş et
</button>
</div>

<!-- Toyota -->
<div class="product">
<img src="https://cdn.pixabay.com/photo/2016/11/18/17/20/oil-1838756_1280.jpg">
<h3>Toyota Yağ</h3>
<div class="price">35 AZN</div>
<button onclick="window.open('https://wa.me/994503843635?text=Salam Toyota yağ sifariş etmək istəyirəm','_blank')">
Sifariş et
</button>
</div>

<!-- Hyundai -->
<div class="product">
<img src="https://cdn.pixabay.com/photo/2013/07/13/10/07/engine-156401_1280.png">
<h3>Hyundai Detal</h3>
<div class="price">20 AZN</div>
<button onclick="window.open('https://wa.me/994503843635?text=Salam Hyundai detal sifariş etmək istəyirəm','_blank')">
Sifariş et
</button>
</div>

<!-- Kia -->
<div class="product">
<img src="https://cdn.pixabay.com/photo/2017/01/06/19/15/oil-1955776_1280.jpg">
<h3>Kia Filter</h3>
<div class="price">18 AZN</div>
<button onclick="window.open('https://wa.me/994503843635?text=Salam Kia filter sifariş etmək istəyirəm','_blank')">
Sifariş et
</button>
</div>

</div>

</body>
</html>
